<!doctype html>
<html><head><meta charset="utf-8"><title>Particle Orb</title>
<style>
  :root{--teal:#46c8b4;--ink:#e4f6f2;--dim:#7f9a98;--panel:rgba(8,10,18,.86)}
  *{box-sizing:border-box;margin:0}
  html,body{background:transparent;overflow:hidden;user-select:none;font:12px "Cascadia Mono","SF Mono",Consolas,monospace;color:var(--ink)}
  #orbWrap{position:absolute;left:30px;top:0;width:240px;height:240px;cursor:grab;
    transform:scale(.6);opacity:.7;transition:transform .45s cubic-bezier(.2,1.5,.4,1),opacity .3s}
  #orbWrap.active{transform:scale(1);opacity:1}
  #orbWrap:hover{transform:scale(.85);opacity:1} #orbWrap.active:hover{transform:scale(1)}
  canvas{width:240px;height:240px;display:block}
  #panel{position:absolute;left:10px;top:236px;width:280px;padding:12px;border:1px solid rgba(70,200,180,.35);
    border-radius:10px;background:var(--panel);opacity:0;transform:translateY(-6px);pointer-events:none;
    transition:opacity .2s,transform .2s}
  #panel.on{opacity:1;transform:none;pointer-events:auto}
  h4{font-size:10px;letter-spacing:.18em;color:var(--teal);margin:10px 0 5px;font-weight:600}
  h4:first-child{margin-top:0}
  #status{color:var(--dim);line-height:1.4;min-height:16px;word-break:break-word}
  #status.ok{color:var(--teal)} #status.error{color:#ff8a8a} #status.setup{color:#ffb35a}
  input[type=text],input[type=url]{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    color:var(--ink);border-radius:5px;padding:5px 7px;font:inherit;margin-bottom:4px}
  input:focus{outline:1px solid var(--teal)}
  button{background:rgba(70,200,180,.14);border:1px solid rgba(70,200,180,.4);color:var(--ink);border-radius:5px;
    padding:4px 8px;font:inherit;cursor:pointer} button:hover{background:rgba(70,200,180,.3)}
  button.ghost{background:none;border-color:rgba(255,255,255,.15);color:var(--dim)}
  .row{display:flex;gap:4px;align-items:center;margin-bottom:4px} .row>input{margin:0;flex:1}
  .bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin:3px 0}
  .bar i{display:block;height:100%;width:0;background:var(--teal)} #score i{background:#c850dc}
  #hit{color:var(--teal);opacity:0;transition:opacity .6s} #hit.flash{opacity:1;transition:none}
  .url{display:flex;gap:4px;align-items:center;margin-bottom:3px} .url span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  label{color:var(--dim);display:flex;gap:5px;align-items:center}
</style></head>
<body>
<div id="orbWrap" class="hit"><canvas id="orb"></canvas></div>

<div id="panel" class="hit">
  <h4>STATUS <span id="hit">● TRIGGERED</span></h4>
  <div id="status">starting…</div>
  <div class="bar" id="mic" title="mic level"><i></i></div>
  <div class="bar" id="score" title="wake score"><i></i></div>

  <h4>WAKE WORD</h4>
  <input type="text" id="callName" placeholder="Call name, e.g. “hey lisa”">
  <div class="row"><input type="text" id="model" placeholder="model.onnx" readonly><button id="browse">Browse</button></div>
  <div class="row"><label style="flex:1">threshold <input type="range" id="thr" min="0.1" max="0.95" step="0.05" style="flex:1"> <b id="thrV"></b></label></div>

  <h4>SERVER LINKS</h4>
  <div id="urls"></div>
  <div class="row"><input type="url" id="newUrl" placeholder="http://localhost:3000"><button id="add">Add</button></div>

  <div class="row" style="margin-top:8px"><label style="flex:1"><input type="checkbox" id="autostart"> start with computer</label>
    <button id="launchAll" class="ghost">Launch all</button></div>
  <div class="row" style="margin-top:6px"><button id="save" style="flex:1">Save</button><button id="quit" class="ghost">Quit</button></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const api = window.orb;

/* ---------- orb (ported from particle_orb.py; STATE_COLORS unchanged) ---------- */
const STATE_COLORS = {
  idle:      { base: [70, 200, 180], hot: [170, 255, 230] },
  listening: { base: [70, 140, 255], hot: [150, 210, 255] },
  speaking:  { base: [200, 80, 220], hot: [255, 170, 90] },
};
const S = 240, N = 520, dpr = window.devicePixelRatio || 1;
const cv = $('#orb'); cv.width = cv.height = S * dpr;
const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
const dirs = new Float32Array(N * 3), phase = new Float32Array(N), speed = new Float32Array(N), jit = new Float32Array(N);
const golden = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), th = golden * i;
  dirs.set([Math.cos(th) * r, y, Math.sin(th) * r], i * 3);
  phase[i] = Math.random() * Math.PI * 2; speed[i] = 0.8 + Math.random() * 1.6; jit[i] = 0.85 + Math.random() * 0.3;
}
let state = 'idle', mic = 0, micAt = 0, ext = 0, extAt = 0, amp = 0, angle = 0, activeUntil = 0;
const now = () => performance.now();
const lerpC = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * Math.max(0, Math.min(1, f))));

function target(t) {
  const micFresh = now() - micAt < 600;
  if (state === 'idle') return Math.max(0.12 + 0.05 * Math.sin(t * 0.9), micFresh ? mic * 0.6 : 0);
  if (state === 'listening') return micFresh ? mic : 0.25 + 0.25 * Math.abs(Math.sin(t * 2.3)) + 0.1 * Math.random();
  if (now() - extAt < 600) return ext;
  const w = 0.5 + 0.3 * Math.sin(t * 6) + 0.2 * Math.sin(t * 13 + 1.3);
  return Math.max(0, Math.min(1, w + (Math.random() < 0.08 ? 0.15 : 0)));
}

function frame(ms) {
  const t = ms / 1000;
  amp += (target(t) - amp) * 0.35;
  if (state !== 'idle' || mic > 0.25) activeUntil = now() + 700;
  $('#orbWrap').classList.toggle('active', now() < activeUntil);

  const col = STATE_COLORS[state], R0 = S * 0.30;
  angle += 0.006 + amp * 0.01;
  const ca = Math.cos(angle), sa = Math.sin(angle), tilt = 18 * Math.PI / 180, ct = Math.cos(tilt), st = Math.sin(tilt);
  const pts = [];
  for (let i = 0; i < N; i++) {
    const x = dirs[i * 3], y = dirs[i * 3 + 1], z = dirs[i * 3 + 2];
    const rad = R0 * jit[i] * (1 + amp * 0.55 * Math.sin(t * speed[i] + phase[i]));
    const xr = x * ca - z * sa, zr = x * sa + z * ca;
    const yr = y * ct - zr * st, z2 = y * st + zr * ct;
    const sc = (620 * S / 760) / (620 * S / 760 + z2 * rad);
    pts.push([S / 2 + xr * rad * sc, S / 2 + yr * rad * sc, z2 * rad, rad, sc, i]);
  }
  pts.sort((p, q) => p[2] - q[2]);

  ctx.clearRect(0, 0, S, S);                       // fully transparent background
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  const [gr, gg, gb] = col.base;
  g.addColorStop(0, `rgba(${gr},${gg},${gb},${0.05 + amp * 0.22})`); g.addColorStop(1, `rgba(${gr},${gg},${gb},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, S, S);

  for (const [px, py, z, rad, sc, i] of pts) {
    const depth = (z + rad) / (2 * rad + 1e-6), e = Math.min(1, amp * 1.6 * jit[i]);
    const c = lerpC(col.base, col.hot, e * (0.4 + 0.6 * depth));
    ctx.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.beginPath(); ctx.arc(px, py, 0.7 + 0.9 * sc, 0, 6.2832); ctx.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- events from main ---------- */
api.on('state', (s) => (state = s));
api.on('level', (v) => { mic = v; micAt = now(); $('#mic i').style.width = v * 100 + '%'; });
api.on('amp', (v) => { ext = v; extAt = now(); });
api.on('score', (v) => ($('#score i').style.width = v * 100 + '%'));
api.on('wake', () => { const h = $('#hit'); h.classList.add('flash'); setTimeout(() => h.classList.remove('flash'), 1200); });
api.on('status', ({ text, kind }) => {
  if (text) { const s = $('#status'); s.textContent = text; s.className = kind; }
  if (kind === 'setup') pin(true);
});

/* ---------- hover panel + click-through ---------- */
let pinned = false, hideT, lastHit = null;
const panel = $('#panel');
const pin = (b) => { pinned = b; if (b) panel.classList.add('on'); };
document.addEventListener('mousemove', (e) => {
  const hit = !!e.target.closest('.hit');
  if (hit !== lastHit) { lastHit = hit; api.ignore(!hit); }
  if (hit) { clearTimeout(hideT); panel.classList.add('on'); }
  else if (!pinned) { clearTimeout(hideT); hideT = setTimeout(() => panel.classList.remove('on'), 450); }
});

/* ---------- drag orb to move; click (no move) pins/unpins panel ---------- */
$('#orbWrap').addEventListener('mousedown', (e) => {
  const sx = e.screenX, sy = e.screenY; let moved = false; api.dragStart();
  const mv = (ev) => { const dx = ev.screenX - sx, dy = ev.screenY - sy; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; api.dragMove(dx, dy); };
  const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); api.dragEnd(); if (!moved) { pinned = !pinned; if (!pinned) panel.classList.remove('on'); } };
  addEventListener('mousemove', mv); addEventListener('mouseup', up);
});

/* ---------- settings ---------- */
let urls = [];
function drawUrls() {
  const box = $('#urls'); box.textContent = '';
  urls.forEach((u, i) => {
    const row = document.createElement('div'); row.className = 'url';
    const sp = document.createElement('span'); sp.textContent = u.url; sp.title = u.url;
    const au = document.createElement('input'); au.type = 'checkbox'; au.checked = u.auto; au.title = 'open at startup';
    au.onchange = () => (u.auto = au.checked);
    const go = document.createElement('button'); go.textContent = '▶'; go.onclick = () => api.launch(u.url);
    const rm = document.createElement('button'); rm.textContent = '×'; rm.className = 'ghost'; rm.onclick = () => { urls.splice(i, 1); drawUrls(); };
    row.append(sp, au, go, rm); box.append(row);
  });
}
$('#add').onclick = () => { let v = $('#newUrl').value.trim(); if (!v) return; if (!/^https?:\/\//.test(v)) v = 'http://' + v; urls.push({ url: v, auto: true }); $('#newUrl').value = ''; drawUrls(); };
$('#browse').onclick = async () => { const p = await api.pickModel(); if (p) $('#model').value = p; };
$('#thr').oninput = () => ($('#thrV').textContent = $('#thr').value);
$('#launchAll').onclick = () => api.launchAll();
$('#quit').onclick = () => api.quit();
$('#save').onclick = async () => {
  if (!$('#model').value || !$('#callName').value.trim()) { $('#status').textContent = 'Need both a call name and a .onnx file.'; $('#status').className = 'setup'; return; }
  await api.saveConfig({ model: $('#model').value, callName: $('#callName').value.trim(), threshold: +$('#thr').value, autostart: $('#autostart').checked, urls });
  pinned = false; panel.classList.remove('on');
};
api.getConfig().then((c) => {
  $('#callName').value = c.callName; $('#model').value = c.model; $('#thr').value = c.threshold;
  $('#thrV').textContent = c.threshold; $('#autostart').checked = c.autostart; urls = c.urls; drawUrls();
});
</script></body></html>
